services:
  backend:
    build: .
    ports: ["8000:8000"]
    environment:
      SIMULATION_SEED: 42
      DATABASE_URL: postgresql://orbitiq:orbitiq@postgres:5432/orbitiq
      DEMO_MODE: "true"
    depends_on: [postgres]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: orbitiq
      POSTGRES_PASSWORD: orbitiq
      POSTGRES_DB: orbitiq
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
