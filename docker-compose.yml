services:
  backend:
    build: .
    ports: ["${BACKEND_PORT:-8000}:8000"]
    environment:
      SIMULATION_SEED: 42
      DATABASE_URL: postgresql://orbitiq:orbitiq@postgres:5432/orbitiq
      DEMO_MODE: "true"
      OPENCELLID_API_KEY: ${OPENCELLID_API_KEY:-}
      ORBITIQ_DATA: ${ORBITIQ_DATA:-}
      CELESTRAK_URL: ${CELESTRAK_URL:-https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle}
    depends_on: [postgres]
  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-5173}:80"]
    depends_on: [backend]
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: orbitiq
      POSTGRES_PASSWORD: orbitiq
      POSTGRES_DB: orbitiq
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
