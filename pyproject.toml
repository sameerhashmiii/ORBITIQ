[tool.ruff]
# ORBITIQ lint policy. Python 3.9 is the floor (system python on dev
# machines), so py310+ syntax upgrades (UP045 `X | None`) are rejected:
# FastAPI/Pydantic evaluate those annotations and crash on 3.9.
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "S", "RUF"]
ignore = [
  "UP045",  # `Optional[X]` required for 3.9 compat (see above)
  "S101",   # asserts are the test suite's mechanism
]
# BLE (blind-except) intentionally not enabled: broad, logged catches are
# the documented resilience strategy (REAL -> CACHE -> SNAPSHOT -> SIM;
# ML/network functions must survive missing data and LLM outages).

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
