server {
  listen 80;
  root /usr/share/nginx/html;

  # Single-page app: serve index.html for unknown routes (hash routing safe).
  location / {
    try_files $uri /index.html;
  }

  # Same-origin API: proxy to the backend service on the compose network.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /health { proxy_pass http://backend:8000; }
  location = /ready { proxy_pass http://backend:8000; }
  location /docs {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
  location /openapi.json {
    proxy_pass http://backend:8000;
  }
}
